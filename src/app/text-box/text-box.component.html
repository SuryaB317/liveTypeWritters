<p>text-box works!</p>



<div >
  <input type="text" (input)="onInputChange($event)" [value]="inputText" />
  <div id="game" >
    <span *ngFor="let char of comparisonResult" class="word">
      <span [ngClass]="{'correct': char.isCorrect, 'incorrect': !char.isCorrect}">
        {{ char.character }}
      </span>
    </span>
  </div>
</div>
